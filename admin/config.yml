# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: rachelthinksthat/bullfrog-post
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/69c33a06-284c-4730-852f-2789c2bbd551/pkce
  auth_token_endpoint: /sites/69c33a06-284c-4730-852f-2789c2bbd551/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://creative-biscotti-31292b.netlify.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "posts"
    label: "Posts"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Poetry", "Food", "Travel", "Essays", "Books", "Film"]
      - { label: "Cover image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "One or two sentences — shown on the homepage and category page." }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Site Pages"
    files:
      - file: "_data/home.json"
        label: "Homepage & About"
        name: "home"
        fields:
          - { label: "Hero eyebrow (small text above the headline)", name: "hero_eyebrow", widget: "string" }
          - { label: "Hero headline", name: "hero_headline", widget: "string" }
          - { label: "Hero intro text", name: "hero_lede", widget: "text" }
          - { label: "Hero image", name: "hero_image", widget: "image", required: false }
          - { label: "About heading", name: "about_heading", widget: "string" }
          - { label: "About bio", name: "about_bio", widget: "text" }
          - { label: "About image", name: "about_image", widget: "image", required: false }
          - { label: "Based in", name: "about_based_in", widget: "string" }
          - { label: "Writing since", name: "about_writing_since", widget: "string" }
          - { label: "Currently reading", name: "about_currently_reading", widget: "string" }
          - { label: "Contact email", name: "about_email", widget: "string" }
      - file: "_data/categories.json"
        label: "Category Pages"
        name: "categories"
        fields:
          - label: "Poetry"
            name: "poetry"
            widget: "object"
            fields:
              - { label: "Display name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Hero image", name: "hero_image", widget: "image", required: false }
          - label: "Food"
            name: "food"
            widget: "object"
            fields:
              - { label: "Display name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Hero image", name: "hero_image", widget: "image", required: false }
          - label: "Travel"
            name: "travel"
            widget: "object"
            fields:
              - { label: "Display name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Hero image", name: "hero_image", widget: "image", required: false }
          - label: "Essays"
            name: "essays"
            widget: "object"
            fields:
              - { label: "Display name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Hero image", name: "hero_image", widget: "image", required: false }
          - label: "Books"
            name: "books"
            widget: "object"
            fields:
              - { label: "Display name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Hero image", name: "hero_image", widget: "image", required: false }
          - label: "Film"
            name: "film"
            widget: "object"
            fields:
              - { label: "Display name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "Hero image", name: "hero_image", widget: "image", required: false }
