backend:
  name: git-gateway
  branch: main

# This lets the CMS commit uploaded images straight into /assets
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: simple

collections:
  - name: "posts"
    label: "Posts"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{category}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post.njk" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Poetry", "Food", "Travel", "Essays", "Books"]
      - { label: "Cover image", name: "image", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "One or two sentences — shown on the homepage and category page." }
      - { label: "Body", name: "body", widget: "markdown" }
